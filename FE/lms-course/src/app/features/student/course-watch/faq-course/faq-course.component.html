<p-accordion [value]="0">
  @for (faqGroup of faqGroups(); track faqGroup.faqGroupId) {
  <p-accordion-panel [value]="faqGroup.faqGroupId">
    <p-accordion-header>{{ faqGroup.title }}</p-accordion-header>
    <p-accordion-content>
      <div class="flex flex-col gap-2">
        @for (item of faqGroup.faqItems; track item.faqItemId) {
        <div class="flex flex-col gap-2">
          <h6 class="font-bold text-xl">{{ item.question }}</h6>
          <p>{{ item.answer }}</p>
        </div>
        }
      </div>
    </p-accordion-content>
  </p-accordion-panel>
  }
</p-accordion>
