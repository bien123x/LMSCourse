<div class="flex flex-col gap-2">
  <h3 class="font-bold text-2xl">Các chứng chỉ của tôi</h3>
  <div class="rounded-2xl overflow-hidden shadow">
    @if (certificates().length > 0) {
    <p-table
      [value]="certificates()"
      showGridlines
      stripedRows
      [scrollable]="true"
      scrollHeight="650px"
      class=""
    >
      <ng-template #header>
        <tr>
          <th>Tên chứng chỉ</th>
          <th>Ngày cấp</th>
          <th>Điểm</th>
          <th>Tổng điểm</th>
          <th>Thao tác</th>
        </tr>
      </ng-template>
      <ng-template #body let-certificate>
        <tr>
          <td>{{ certificate.certificateName }}</td>
          <td>{{ certificate.issueDate | date : 'dd/MM/yyyy' }}</td>
          <td>{{ certificate.marks }}</td>
          <td>{{ certificate.outOf }}</td>
          <td>
            <div class="flex items-center gap-2">
              <p-button
                *appHasPermission="PERMISSION.Students.Certificates.ViewDetails"
                icon="pi pi-eye"
                [rounded]="true"
                [outlined]="true"
                severity="secondary"
                (onClick)="openCertificate(certificate.certificateUrl)"
              ></p-button>
              <!-- <p-button
              icon="pi pi-download"
              [rounded]="true"
              [outlined]="true"
              severity="secondary"
            ></p-button> -->
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
    }
  </div>
</div>

<p-dialog
  [modal]="true"
  [(visible)]="visibleViewCertificate"
  header="Xem chứng chỉ"
  [style]="{ width: '80vw', height: '90vh', padding: '0' }"
  [contentStyle]="{ padding: '0', height: '100%' }"
  [breakpoints]="{ '1199px': '90vw', '575px': '95vw' }"
  [maximizable]="true"
>
  <div style="height: 100%; display: flex; flex-direction: column">
    @if (certificateUrl) {
    <iframe [src]="certificateUrl" style="flex: 1; width: 100%; border: none"></iframe>
    }
  </div>
</p-dialog>
