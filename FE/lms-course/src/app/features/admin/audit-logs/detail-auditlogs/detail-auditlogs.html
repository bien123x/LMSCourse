<p-table [value]="valueTable()">
  <ng-template #body let-field>
    <tr>
      <th>{{ field.label }}</th>
      @if (field.label == "Ngày") {
      <td class="border-0">{{ field.value | date : 'short' }}</td>
      } @else if (field.label == "Thời gian") {
      <td class="border-0">{{ field.value }} <i>giây</i></td>
      } @else {
      <td class="border-0">{{ field.value }}</td>
      }
    </tr>
  </ng-template>
</p-table>
